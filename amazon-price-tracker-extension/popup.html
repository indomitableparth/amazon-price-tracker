<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Track Product</title>
  <style>
    body { font-family: Arial; width: 250px; padding: 10px; }
    input, button { width: 100%; margin: 8px 0; }
  </style>
</head>
<body>
  <h3>Track this Product</h3>
  <form id="trackForm">
    <input type="email" id="email" placeholder="Your Email" required />
    <input type="number" id="price" placeholder="Target Price (₹)" required />
    <button type="submit">Track</button>
  </form>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
